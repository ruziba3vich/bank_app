<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Birdarcha Token Refresher — Options</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
      .row { margin-top: 12px; }
      .status { margin-top: 16px; color: #555; font-size: 13px; }
    </style>
  </head>
  <body>
    <h2>Birdarcha Token Refresher</h2>

    <label for="apiBase">Bank-app base URL</label>
    <input id="apiBase" placeholder="https://bank-back.shoha-coder.uz" />

    <label for="apiKey">X-Api-Key</label>
    <input id="apiKey" type="password" placeholder="paste BIRDARCHA_API_KEY from .env" />

    <label for="intervalMin">Refresh interval (minutes)</label>
    <input id="intervalMin" type="number" min="5" value="180" />

    <div class="row">
      <button id="save">Save</button>
      <button id="refresh">Refresh now</button>
    </div>

    <div class="status" id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
